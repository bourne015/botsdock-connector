[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "botsdock-connector"
version = "0.1.14"
description = "Provider-neutral connector for BotsDock Agent Workbench"
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.2.163,<0.3",
    "websockets>=16,<17",
    "jsonschema>=4.26,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://www.botsdock.cn"
Repository = "https://github.com/bourne015/botsdock-connector"

[project.scripts]
botsdock-connector = "botsdock_connector.cli:main"

[tool.setuptools.packages.find]
include = ["botsdock_connector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "asyncio: mark test as an async test",
]
