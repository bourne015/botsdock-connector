[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "botsdock-connector"
version = "0.1.2"
description = "Provider-neutral connector for BotsDock Agent Workbench"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk",
    "websockets>=16,<17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
botsdock-connector = "botsdock_connector.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
