[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "botsdock-connector"
version = "0.1.5"
description = "Provider-neutral connector for BotsDock Agent Workbench"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.1.80",
    "websockets>=16,<17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.urls]
Homepage = "https://www.botsdock.cn"
Repository = "https://github.com/bourne015/botsdock-connector"

[project.scripts]
botsdock-connector = "botsdock_connector.cli:main"

[tool.setuptools.packages.find]
include = ["botsdock_connector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
