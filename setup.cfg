[metadata]
name = botsdock-connector
version = 0.1.0
description = Provider-neutral connector for BotsDock Agent Workbench

[options]
packages = find:
python_requires = >=3.10
install_requires =
    claude-agent-sdk
    websockets>=16,<17

[options.packages.find]
include =
    botsdock_connector*

[options.entry_points]
console_scripts =
    botsdock-connector = botsdock_connector.cli:main
